spring:
  application:
    name: library-api
  profiles:
    # local = H2 (no Docker). docker = MySQL via Compose on port 3307.
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
